name: Docker images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable SHA-tagged images to private GHCR packages
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Normalize image namespace
        id: image
        run: echo "repository=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: app
          load: true
          tags: local/msoj-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Check application configuration
        run: docker run --rm -e MSOJ_BUILD=1 -e DJANGO_SETTINGS_MODULE=dmoj.settings local/msoj-app:${{ github.sha }} python manage.py check
      - name: Build proxy and event images
        run: |
          docker buildx build --file Dockerfile --target proxy --tag local/msoj-proxy:${{ github.sha }} --load .
          docker buildx build --file Dockerfile --target events --tag local/msoj-events:${{ github.sha }} --load .
      - name: Exercise MariaDB stack and focused contracts
        env:
          MSOJ_APP_IMAGE: local/msoj-app:${{ github.sha }}
          MSOJ_PROXY_IMAGE: local/msoj-proxy:${{ github.sha }}
          MSOJ_EVENTS_IMAGE: local/msoj-events:${{ github.sha }}
        run: python3 -m docker.ci
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable SHA-tagged images
        if: inputs.publish
        env:
          IMAGE_NAMESPACE: ghcr.io/${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for target in app proxy events; do
            docker tag "local/msoj-$target:$IMAGE_TAG" "$IMAGE_NAMESPACE/$target:$IMAGE_TAG"
            docker push "$IMAGE_NAMESPACE/$target:$IMAGE_TAG"
          done
