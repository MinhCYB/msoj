{% load static %}
{{ visual_templates|json_script:"mv-author-templates" }}
<fieldset class="module aligned mv-author" data-preview-url="{% url 'roadmap_markdown_preview' %}">
  <h2>Trực quan hóa bài giảng</h2>
  <p>Tài liệu khai báo v2; chèn vào bài chưa lưu, sau đó xem trước để kiểm tra.</p>
  <div class="form-row"><label for="mv-author-template">Ví dụ</label><select id="mv-author-template">{% for key in visual_templates %}<option value="{{ key }}">{{ key }}</option>{% endfor %}</select><button type="button" id="mv-author-load-template">Nạp ví dụ</button></div>
  <div class="form-row"><label for="mv-author-title">Tiêu đề</label><input id="mv-author-title"><label for="mv-author-summary">Mô tả thay thế</label><input id="mv-author-summary"><button type="button" id="mv-author-sync-form">Cập nhật mô tả</button></div>
  <div class="form-row"><label for="mv-author-module-type">Module</label><select id="mv-author-module-type"><option>vector</option><option>queue</option><option>stack</option><option>table</option><option>chart</option><option>graph</option><option>tree</option><option>matrix</option><option>map</option><option>set</option><option>hash-table</option><option>variables</option><option>call-stack</option><option>scene</option><option>number-line</option><option>formula</option><option>explanation</option><option>code</option><option>output</option></select><label for="mv-author-grid-columns">Số cột</label><input id="mv-author-grid-columns" type="number" min="1" max="4" value="2"><button type="button" id="mv-author-add-module">Thêm module</button><button type="button" id="mv-author-grid">Sắp lại lưới</button></div>
  <div class="form-row"><label for="mv-author-document">Tài liệu JSON</label><textarea id="mv-author-document" rows="22" cols="100" style="max-width:100%"></textarea></div>
  <div class="form-row"><button type="button" id="mv-author-insert">Chèn vào bài giảng</button><button type="button" id="mv-author-preview">Xem trước nội dung chưa lưu</button><p id="mv-author-status" role="status" aria-live="polite"></p></div>
  <iframe title="Xem trước bài giảng chưa lưu" hidden style="width:100%;height:650px;border:1px solid #888"></iframe>
</fieldset>
