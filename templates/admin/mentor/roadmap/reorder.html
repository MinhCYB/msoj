<form method="post" class="rm-inline">{% csrf_token %}<input type="hidden" name="action" value="reorder"><input type="hidden" name="target" value="{{ target }}"><input type="hidden" name="item" value="{{ item.pk }}">{% if target == 'lesson' and shared %}<label><input type="checkbox" name="confirm_shared" required> Áp dụng mọi nơi dùng chung</label>{% endif %}<button name="direction" value="up" aria-label="Đưa mục này lên">↑ Lên</button><button name="direction" value="down" aria-label="Đưa mục này xuống">↓ Xuống</button></form>
