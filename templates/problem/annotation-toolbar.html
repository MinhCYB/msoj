<div
  id="ms-annotation-toolbar"
  class="ms-annotation-toolbar"
  hidden
  role="toolbar"
  aria-label="Công cụ nháp"
>
  <div class="ms-annotation-tools" role="group" aria-label="Công cụ vẽ">
    <button type="button" data-tool="select" aria-pressed="true" aria-label="Chọn" title="Chọn">
      <i class="fa fa-mouse-pointer" aria-hidden="true"></i>
    </button>
    <button type="button" data-tool="pen" aria-pressed="false" aria-label="Bút" title="Bút">
      <i class="fa fa-pencil" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      data-tool="highlight"
      aria-pressed="false"
      aria-label="Tô sáng"
      title="Tô sáng"
    >
      <i class="fa fa-paint-brush" aria-hidden="true"></i>
    </button>
    <button type="button" data-tool="text" aria-pressed="false" aria-label="Chữ" title="Chữ">
      <i class="fa fa-font" aria-hidden="true"></i>
    </button>
    <button type="button" data-tool="line" aria-pressed="false" aria-label="Đường" title="Đường">
      <span aria-hidden="true">╱</span>
    </button>
    <button
      type="button"
      data-tool="arrow"
      aria-pressed="false"
      aria-label="Mũi tên"
      title="Mũi tên"
    >
      <i class="fa fa-long-arrow-right" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      data-tool="rectangle"
      aria-pressed="false"
      aria-label="Chữ nhật"
      title="Chữ nhật"
    >
      <i class="fa fa-square-o" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      data-tool="circle"
      aria-pressed="false"
      aria-label="Hình tròn"
      title="Hình tròn"
    >
      <i class="fa fa-circle-o" aria-hidden="true"></i>
    </button>
    <button type="button" data-tool="eraser" aria-pressed="false" aria-label="Tẩy" title="Tẩy">
      <i class="fa fa-eraser" aria-hidden="true"></i>
    </button>
    <span class="ms-annotation-separator" aria-hidden="true"></span>
    <button type="button" data-action="undo" aria-label="Hoàn tác" title="Hoàn tác">
      <i class="fa fa-undo" aria-hidden="true"></i>
    </button>
    <button type="button" data-action="redo" aria-label="Làm lại" title="Làm lại">
      <i class="fa fa-repeat" aria-hidden="true"></i>
    </button>
    <button type="button" data-action="clear" aria-label="Xóa tất cả" title="Xóa tất cả">
      <i class="fa fa-trash-o" aria-hidden="true"></i>
    </button>
    <span class="ms-annotation-separator" aria-hidden="true"></span>
    <input type="color" value="#2457a7" aria-label="Màu nét vẽ" title="Màu nét vẽ" />
    <button type="button" data-action="close" aria-label="Đóng Nháp" title="Đóng Nháp">
      <i class="fa fa-times" aria-hidden="true"></i>
    </button>
  </div>
  <span class="ms-annotation-status visually-hidden" role="status" aria-live="polite"></span>
</div>
