{% macro progress(value, label) -%}
    {% if value.state == 'available' %}{{ label }}: AC {{ value.solved }}/{{ value.total }}
    {% elif value.state == 'anonymous' %}Đăng nhập để xem AC
    {% elif value.state == 'empty' %}Chưa có bài tập
    {% else %}Tiến độ tạm không khả dụng{% endif %}
{%- endmacro %}
