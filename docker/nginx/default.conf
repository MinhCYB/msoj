server {
    listen 80 default_server;
    server_name _;
    root /app/static-build;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /_healthz { return 404; }
    location ^~ /static/ { alias /app/static-build/; access_log off; expires 1h; }
    location ^~ /media/ { alias /data/media/; expires 7d; }
    location ^~ /static-upload/ { alias /data/media/static-upload/; expires 7d; }
    location ^~ /pdf/ { alias /data/media/pdf/; expires 7d; }
    location ~ ^/martor/[0-9a-f-]+\.(jpg|png|gif|svg)$ { root /data/media; expires 7d; }
    location /event/ {
        proxy_pass http://event_websocket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location /channels/ {
        proxy_pass http://event_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    error_page 413 = @request_too_large;
    location @request_too_large {
        default_type text/html;
        return 413 '<!doctype html><html><head><title>Upload too large</title></head><body><h1>Upload too large</h1><p>The request exceeds the 100 MB upload limit. Reduce the file size and try again.</p></body></html>';
    }
}

server {
    listen 8081;
    server_name _;
    root /app/static-build;

    # cloudflared is the only peer on the dedicated 172.30.42.0/29 network.
    set_real_ip_from 172.30.42.2;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
