user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    geo $realip_remote_addr $cloudflare_peer {
        default 0;
        172.30.42.2 1;
    }
    map "$cloudflare_peer:$http_cf_visitor" $external_proto {
        default $scheme;
        ~^1:.*"scheme":"(https?)".*$ $1;
    }

    upstream django_app { server web:8000; }
    upstream event_websocket { server events:9996; }
    upstream event_http { server events:9995; }
    include /etc/nginx/conf.d/*.conf;
}
